plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def sourceCommit = 'unknown'
try {
    sourceCommit = providers.exec {
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
    // A source archive without Git metadata keeps the diagnostic field explicit.
}

tasks.named('jar') {
    manifest {
        attributes 'FutureShops-Source-Commit': sourceCommit
    }
}

def danconomyJarProperty = providers.gradleProperty('danconomyJar')
def danconomyJarFile = danconomyJarProperty.map { new File(it).absoluteFile }
def verificationGameDirectory = providers.gradleProperty('verificationGameDirectory')
def danconomyCrashPoint = providers.gradleProperty('danconomyCrashPoint')
def finalEconomyBridgeClasspathProperty = providers.gradleProperty('finalEconomyBridgeClasspath')
def expectedDanconomySha256 = '61d3eb69a3a235929ac2376d151130e61ea4fe65c2f84990618c79e27e954b72'
def verifyDanconomyCompileOnly = tasks.register('verifyDanconomyCompileOnly') {
    onlyIf { danconomyJarProperty.isPresent() }
    inputs.file(danconomyJarFile).optional()
    inputs.property('expectedSha256', expectedDanconomySha256)
    doLast {
        def artifact = danconomyJarFile.get()
        if (!artifact.isFile()) {
            throw new GradleException('the danconomy compile only artifact is missing')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, count)
            }
        }
        def actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (actual != expectedDanconomySha256) {
            throw new GradleException('the danconomy compile only artifact hash is unsupported')
        }
    }
}

// Builds the separately installed transaction proof registrant, never the production mod jar.
def vaultProofSources = fileTree('src/test/fixtures/vault-proof/src') {
    include '**/*.java'
}
def compileVaultProofFixture = tasks.register('compileVaultProofFixture', JavaCompile) {
    dependsOn tasks.named('testClasses')
    source vaultProofSources
    destinationDirectory = layout.buildDirectory.dir('vault-proof/classes')
    classpath = sourceSets.test.runtimeClasspath
    options.release = 21
}
tasks.register('vaultProofJar', Jar) {
    dependsOn compileVaultProofFixture
    archiveFileName = 'futureshops-vault-proof-1.0.0.jar'
    destinationDirectory = layout.buildDirectory.dir('vault-proof')
    from(compileVaultProofFixture) {
        exclude 'previous-compilation-data.bin'
    }
    from(sourceSets.test.output.classesDirs) {
        include 'com/enviouse/futureshopsp/vaultproof/SqliteVaultProofBackend*.class'
        include 'com/enviouse/futureshopsp/vaultproof/SqliteVaultProofProvider*.class'
    }
    from('src/test/fixtures/vault-proof') {
        exclude 'src/**'
    }
}

def finalEconomyBridgeSources = fileTree('src/test/fixtures/finaleconomy-bridge/src') {
    include '**/*.java'
}
def compileFinalEconomyBridgeFixture = tasks.register('compileFinalEconomyBridgeFixture', JavaCompile) {
    onlyIf { finalEconomyBridgeClasspathProperty.isPresent() }
    source finalEconomyBridgeSources
    destinationDirectory = layout.buildDirectory.dir('finaleconomy-bridge/classes')
    classpath = finalEconomyBridgeClasspathProperty.map { files(it.split(File.pathSeparator)) }.getOrElse(files())
    options.release = 21
}
tasks.register('finalEconomyBridgeJar', Jar) {
    onlyIf { finalEconomyBridgeClasspathProperty.isPresent() }
    dependsOn compileFinalEconomyBridgeFixture
    archiveFileName = 'futureshops-finaleconomy-bridge-1.0.0.jar'
    destinationDirectory = layout.buildDirectory.dir('finaleconomy-bridge')
    from(compileFinalEconomyBridgeFixture) {
        exclude 'previous-compilation-data.bin'
    }
    from('src/test/fixtures/finaleconomy-bridge') {
        include 'plugin.yml'
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

base {
    archivesName = mod_id
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def gameTestStructure = layout.buildDirectory.file("generated/gameTestResources/data/${mod_id}/structure/empty.nbt")
def prepareGameTestStructure = tasks.register('prepareGameTestStructure') {
    def encodedFile = layout.projectDirectory.file('src/gameTestFixtures/empty.nbt.b64')
    inputs.file(encodedFile)
    outputs.file(gameTestStructure)
    doLast {
        def output = gameTestStructure.get().asFile
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(encodedFile.asFile.getText('UTF-8').replaceAll('\\s', ''))
    }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/gameTestResources'))
tasks.named(sourceSets.main.processResourcesTaskName).configure {
    dependsOn(prepareGameTestStructure)
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (danconomyCrashPoint.isPresent()) {
                systemProperty 'futureshops.danconomy.crash.point', danconomyCrashPoint.get()
            }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (verificationGameDirectory.isPresent()) {
                gameDirectory = file(verificationGameDirectory.get())
            }
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Enable JUnit tests that can load Minecraft/NeoForge classes.
    unitTest {
        enable()
        testedMod = mods."$mod_id"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // GeckoLib — animated shop block (GeoBlockEntity + renderers).
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.4'
    if (danconomyJarProperty.isPresent()) {
        compileOnly files(danconomyJarProperty.get())
        localRuntime files(danconomyJarProperty.get())
    }

    // Unit tests (JUnit 5). The Minecraft/NeoForge classpath is provided to the test
    // source set by the neoForge.unitTest block below (MDG wiring).
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // First party Vault transaction proof fixture only. This never enters the production jar.
    testImplementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    // NeoForge test framework: EphemeralTestServerProvider boots a MinecraftServer with the mod's
    // registries (item + data component) loaded, so registration-dependent invariants are testable.
    testImplementation "net.neoforged:testframework:${neo_version}"

    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

tasks.named('compileJava') {
    dependsOn verifyDanconomyCompileOnly
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
